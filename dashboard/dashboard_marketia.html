<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MarketIA — Intelligence marketing &amp; prédiction du churn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14122B; --ink-2:#221D46; --canvas:#F4F3F9; --card:#FFFFFF; --line:#E6E3F1;
  --text:#16142E; --muted:#6B6788; --faint:#9A95B4;
  --violet:#6C4CF1; --violet-2:#8E74FF; --violet-soft:#EEEAFF;
  --teal:#128C7E; --teal-soft:#E0F3F0; --amber:#C97B0E; --amber-soft:#FCF0DC;
  --rose:#C8324F; --rose-soft:#FCE7EB; --blue:#2563C9;
  --radius:16px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(20,18,43,.05), 0 8px 24px -16px rgba(20,18,43,.28);
  --sans:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --display:'Bricolage Grotesque','Inter',system-ui,sans-serif;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ } }
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--canvas); color:var(--text); font-family:var(--sans);
  font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
  font-feature-settings:"tnum" 1,"cv05" 1;
}
h1,h2,h3,h4{font-family:var(--display); margin:0; letter-spacing:-.018em; font-weight:700}
a{color:var(--violet)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--violet); outline-offset:2px; border-radius:6px}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }

/* ---------- Structure ---------- */
/* La page défile normalement (c'est le document — donc l'iframe Streamlit,
   qui a scrolling=True — qui gère le défilement). On évite tout piège où
   .main serait forcé à une hauteur fixe (100vh) sans rapport avec la vraie
   hauteur de la fenêtre d'accueil : dans une iframe à hauteur fixe, cela
   coince le défilement dès qu'une page a moins de contenu que cette hauteur
   (Segmentation, Profilage…), ou le limite à une zone interne invisible du
   reste. La barre latérale reste visible grâce à position:sticky, qui ne
   bloque pas le défilement du document comme le ferait position:fixed. */
html,body{min-height:100%}
.shell{display:flex; min-height:100vh}
.sidebar{
  width:258px; flex:0 0 258px; background:var(--ink); color:#D9D5EE;
  padding:22px 16px; display:flex; flex-direction:column; gap:22px;
  position:sticky; left:0; top:0; align-self:flex-start; z-index:1000; height:100vh;
  overflow-y:auto; overscroll-behavior:contain;
}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16); border-radius:3px}
.brand{display:flex; gap:11px; align-items:center; padding:2px 6px 0}
.brand-mark{
  width:38px;height:38px;border-radius:11px;flex:0 0 38px;
  background:linear-gradient(145deg,#8E74FF,#5636D6); display:grid; place-items:center;
}
.brand-mark svg{width:20px;height:20px}
.brand-name{font-family:var(--display); font-weight:700; font-size:16px; color:#fff; line-height:1.1}
.brand-sub{font-size:11.5px; color:#8E88B8}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:11px; color:#7E78AC; padding:0 10px 6px; letter-spacing:.02em}
.nav button{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  background:transparent; border:0; color:#C4BFE2; padding:9px 11px; border-radius:9px;
  font-size:13.5px; cursor:pointer; transition:background .15s, color .15s;
}
.nav button:hover{background:rgba(255,255,255,.06); color:#fff}
.nav button[aria-current="page"]{background:var(--violet); color:#fff; font-weight:600}
.nav .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55;flex:0 0 6px}
.nav button[aria-current="page"] .dot{opacity:1}
.side-foot{margin-top:auto; font-size:11.5px; color:#7E78AC; line-height:1.5; border-top:1px solid rgba(255,255,255,.08); padding-top:14px}
.side-foot b{color:#C4BFE2; font-weight:600}
.import-btn{
  margin-top:10px; width:100%; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12);
  color:#D9D5EE; padding:8px 10px; border-radius:9px; font-size:12.5px; cursor:pointer;
}
.import-btn:hover{background:rgba(255,255,255,.13); color:#fff}

.main{flex:1; min-width:0; padding:26px 30px 56px; max-width:1420px}
html{scroll-behavior:smooth}
.topline{display:flex; justify-content:space-between; align-items:flex-start; gap:20px; flex-wrap:wrap; margin-bottom:22px}
.chip{
  display:inline-flex; align-items:center; gap:7px; background:var(--violet-soft); color:#4B32B8;
  font-size:12px; font-weight:600; padding:5px 12px; border-radius:999px;
}
.chip.neutral{background:#fff; color:var(--muted); border:1px solid var(--line); font-weight:500}
.chip.live{background:var(--teal-soft); color:var(--teal)}
h1.page{font-size:31px; margin:11px 0 6px; letter-spacing:-.03em}
.page-lede{color:var(--muted); max-width:72ch; font-size:14.5px}

/* ---------- Cartes ---------- */
.grid{display:grid; gap:16px; align-items:start}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow); min-width:0}
.card h3{font-size:14.5px; margin-bottom:2px}
.card .hint{font-size:12.5px; color:var(--muted); margin-bottom:14px}
.card.flush{padding-bottom:12px}

.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(178px,1fr)); gap:14px; margin-bottom:20px}
.kpi{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow)}
.kpi .k-label{font-size:12.5px; color:var(--muted)}
.kpi .k-val{font-family:var(--display); font-size:26px; font-weight:700; letter-spacing:-.03em; margin-top:6px; line-height:1.15}
.kpi .k-sub{font-size:12px; color:var(--faint); margin-top:3px}
.kpi.accent{background:linear-gradient(150deg,#241D52,#14122B); border-color:#241D52; color:#fff}
.kpi.accent .k-label{color:#A9A2D6} .kpi.accent .k-sub{color:#8E88B8}

/* ---------- Tableaux ---------- */
table{width:100%; border-collapse:collapse; font-size:13px}
th{text-align:left; font-weight:600; color:var(--muted); font-size:12px; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap}
td{padding:9px 10px; border-bottom:1px solid #F2F0F8; vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right; font-variant-numeric:tabular-nums}
.table-wrap{overflow-x:auto}
.tag{display:inline-block; padding:2px 9px; border-radius:999px; font-size:11.5px; font-weight:600}
.tag.v{background:var(--violet-soft); color:#4B32B8}
.tag.t{background:var(--teal-soft); color:var(--teal)}
.tag.a{background:var(--amber-soft); color:var(--amber)}
.tag.r{background:var(--rose-soft); color:var(--rose)}
.best{font-weight:600}

/* ---------- Segmentation / personas ---------- */
.seg-card{border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; background:#fff; box-shadow:var(--shadow)}
.seg-head{display:flex; align-items:center; gap:9px; margin-bottom:10px}
.seg-swatch{width:10px;height:10px;border-radius:3px}
.seg-title{font-family:var(--display); font-weight:700; font-size:15px}
.stat-row{display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-bottom:1px dashed #EEECF6; font-size:13px}
.stat-row:last-child{border-bottom:0}
.stat-row span:first-child{color:var(--muted)}
.stat-row b{font-weight:600; font-variant-numeric:tabular-nums}
.meter{height:6px; background:#EFEDF7; border-radius:999px; overflow:hidden; margin-top:4px}
.meter i{display:block; height:100%; border-radius:999px; background:var(--violet)}

/* ---------- Simulateur ---------- */
.form-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px 14px}
.field label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:5px}
.field input, .field select{
  width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:var(--radius-sm);
  font-size:13.5px; font-family:inherit; background:#FCFCFE; color:var(--text);
}
.field input:focus, .field select:focus{border-color:var(--violet); outline:none; box-shadow:0 0 0 3px rgba(108,76,241,.14)}
.derived{background:#FAF9FD; border:1px dashed var(--line); border-radius:var(--radius-sm); padding:11px 13px; margin-top:14px; font-size:12.5px; color:var(--muted)}
.derived ul{margin:6px 0 0; padding-left:0; list-style:none; display:grid; grid-template-columns:repeat(2,1fr); gap:3px 14px}
.derived b{color:var(--text); font-variant-numeric:tabular-nums}
.presets{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:14px}
.presets button{
  border:1px solid var(--line); background:#fff; border-radius:999px; padding:5px 11px;
  font-size:12px; cursor:pointer; color:var(--muted)
}
.presets button:hover{border-color:var(--violet); color:var(--violet)}
.gauge-wrap{display:flex; flex-direction:column; align-items:center; text-align:center; padding:6px 0 2px}
.gauge-val{font-family:var(--display); font-size:44px; font-weight:800; letter-spacing:-.04em; line-height:1}
.gauge-cap{font-size:12.5px; color:var(--muted); margin-top:2px}
.verdict{margin-top:14px; padding:12px 14px; border-radius:var(--radius-sm); font-size:13px}
.verdict b{display:block; font-size:13.5px; margin-bottom:2px}
.contrib{display:flex; flex-direction:column; gap:7px; margin-top:16px}
.contrib-row{display:grid; grid-template-columns:1fr auto; gap:8px; font-size:12.5px}
.note{font-size:12.5px; color:var(--muted); background:#FAF9FD; border-left:3px solid var(--violet); padding:10px 14px; border-radius:0 var(--radius-sm) var(--radius-sm) 0; margin-top:16px}
.legend{display:flex; flex-wrap:wrap; gap:12px; font-size:12px; color:var(--muted); margin-top:8px}
.legend i{display:inline-block; width:9px;height:9px;border-radius:2px; margin-right:5px}
.cm{display:grid; grid-template-columns:auto 1fr 1fr; gap:6px; align-items:center; font-size:12.5px}
.cm .cell{border-radius:var(--radius-sm); padding:12px 8px; text-align:center; font-variant-numeric:tabular-nums}
.cm .cell b{display:block; font-family:var(--display); font-size:19px; font-weight:700}
.cm .rowlab{color:var(--muted); font-size:12px; text-align:right; padding-right:4px}
.cm .collab{color:var(--muted); font-size:12px; text-align:center}
.priority-section{border:1.5px solid var(--violet); background:linear-gradient(180deg,var(--violet-soft) 0%, #fff 120px)}
.priority-list{display:flex; flex-direction:column; gap:10px; margin-top:12px}
.priority-card{display:flex; gap:14px; align-items:center; background:#fff; border:1px solid var(--line); border-radius:var(--radius-sm); padding:12px 16px; box-shadow:var(--shadow)}
.priority-rank{flex:0 0 auto; width:34px; height:34px; border-radius:10px; background:var(--ink); color:#fff; display:grid; place-items:center; font-family:var(--display); font-weight:800; font-size:14px}
.priority-body{flex:1; min-width:0}
.priority-name{font-family:var(--display); font-weight:700; font-size:15px; margin-bottom:4px}
.priority-stats{display:flex; gap:16px; flex-wrap:wrap; font-size:12.5px; color:var(--muted); margin-bottom:6px}
.priority-stats b{color:var(--text); font-variant-numeric:tabular-nums}
.switch{display:inline-flex; background:#F1EFF8; border-radius:999px; padding:3px; gap:2px}
.switch.wrap{flex-wrap:wrap; border-radius:14px}
.switch button{border:0; background:transparent; padding:6px 13px; border-radius:999px; font-size:12.5px; cursor:pointer; color:var(--muted); white-space:nowrap}
.switch button[aria-pressed="true"]{background:#fff; color:var(--text); font-weight:600; box-shadow:0 1px 2px rgba(20,18,43,.1)}
.filter-bar{padding:16px 20px}
.filter-row{display:flex; gap:28px; flex-wrap:wrap; align-items:flex-start}
.filter-group{display:flex; flex-direction:column; gap:7px}
.filter-label{font-size:11.5px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.03em}
svg{display:block; max-width:100%}
.axis{font-size:11px; fill:var(--muted); font-family:var(--sans)}
.steps{counter-reset:s; display:flex; flex-direction:column; gap:14px}
.step{display:grid; grid-template-columns:30px 1fr; gap:13px}
.step .n{width:26px;height:26px;border-radius:8px;background:var(--violet-soft); color:#4B32B8; display:grid;place-items:center; font-size:12.5px; font-weight:700}
.step h4{font-size:13.5px; margin-bottom:2px}
.step p{margin:0; color:var(--muted); font-size:13px}
code{background:#F1EFF8; padding:1px 6px; border-radius:5px; font-size:12.5px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.hide{display:none !important}
@media (max-width:1100px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:860px){
  .shell{flex-direction:column}
  .sidebar{width:100%; flex:none; height:auto; overflow:visible}
  .nav{flex-direction:row; flex-wrap:wrap}
  .nav button{width:auto}
  .main{padding:20px 16px 40px}
  .result-card{position:static !important}
  .g2,.g3,.g4,.form-grid{grid-template-columns:minmax(0,1fr)}
  .span2{grid-column:auto}
  h1.page{font-size:25px}
}

/* ---------- Interactions ---------- */
.primary-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;padding:10px 16px;border:0;border-radius:10px;background:var(--violet);color:#fff;font:600 13px var(--sans);cursor:pointer;box-shadow:0 5px 14px rgba(108,76,241,.22);transition:transform .15s,background .15s}
.primary-btn:hover{background:var(--violet-2);transform:translateY(-1px)}
.chart-tooltip{position:fixed;z-index:9999;pointer-events:none;background:#14122B;color:#fff;border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:7px 10px;font:12px/1.35 var(--sans);box-shadow:0 8px 24px rgba(20,18,43,.22);max-width:260px;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
.chart-tooltip.visible{opacity:1;transform:translateY(0)}
/* Toute forme SVG qui porte un <title> devient interactive au survol.
   La classe .is-hover est posée par le JS (support universel) ;
   le sélecteur :has sert de repli purement CSS. */
svg [data-tip], svg :is(rect,circle,path,polyline):has(> title){cursor:crosshair; transition:opacity .12s, filter .12s}
svg .is-hover{opacity:.82; filter:brightness(1.08)}
svg circle.is-hover[fill="transparent"]{opacity:1; fill:rgba(108,76,241,.18); stroke:var(--violet); stroke-width:1.5}

/* ---------- Panneau de prédiction ---------- */
.field input.invalid{border-color:var(--rose); background:#FFF5F7; color:var(--rose)}
.field input.invalid:focus{box-shadow:0 0 0 3px rgba(200,50,79,.14); border-color:var(--rose)}
.result-card{position:sticky; top:12px; align-self:start}
.predict-empty{display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:10px; text-align:center; padding:34px 18px; border:1px dashed var(--line);
  border-radius:var(--radius-sm); background:#FBFAFE; color:var(--muted); font-size:13px}
.predict-empty .big{font-size:30px; line-height:1}
#predictBody{display:none}
#predictBody.shown{display:block; animation:popIn .25s ease-out}
@keyframes popIn{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
.primary-btn:active{transform:translateY(1px)}
.primary-btn[disabled]{opacity:.6; cursor:progress}
</style>
</head>

    <div class="brand">

    </div>

  </aside>
  <main class="main" id="main"></main>
</div>

}

function areaChart(points, {h=240, yFmt=shortNum, color=C.violet, everyX=6, w=720}={}){
  const pad = {l:46, r:16, t:12, b:26};
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const max = niceMax(Math.max(...points.map(p=>p.v)));
  const X = i => pad.l + (points.length<2?iw/2:i*iw/(points.length-1));
  const Y = v => pad.t + ih - (v/max)*ih;
  const line = points.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
  const area = `${line} L${X(points.length-1).toFixed(1)},${pad.t+ih} L${X(0).toFixed(1)},${pad.t+ih} Z`;
  let grid = '', ticks = '';
  for (let i=0;i<=4;i++){
    const v = max*i/4, y = Y(v);
    grid += `<line x1="${pad.l}" x2="${w-pad.r}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#EEECF6"/>`;
    ticks += `<text class="axis" x="${pad.l-8}" y="${(y+4).toFixed(1)}" text-anchor="end">${yFmt(v)}</text>`;
  }
  let xlab = '';
  points.forEach((p,i)=>{ if (i % everyX === 0 || i===points.length-1){
    const last = i===points.length-1;
    xlab += `<text class="axis" x="${X(i).toFixed(1)}" y="${h-7}" text-anchor="${last?'end':'middle'}">${esc(p.l)}</text>`;} });
  const dots = points.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="8" fill="transparent"><title>${esc(p.l)} — ${esc(p.t||yFmt(p.v))}</title></circle>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" role="img" preserveAspectRatio="none" style="width:100%;height:${h}px">
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".28"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}${ticks}<path d="${area}" fill="url(#ag)"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round"/>
    ${xlab}${dots}</svg>`;
}

function barsV(items, {h=250, color=C.violet, fmt=shortNum, colors=null, rotate=false, w=720}={}){
  const pad = {l:46, r:8, t:12, b: rotate?58:26};
  const iw = w-pad.l-pad.r, ih = h-pad.t-pad.b;
  const max = niceMax(Math.max(...items.map(d=>d.value)));
  const step = iw/items.length, bw = Math.min(58, step*0.62);
  let grid='', ticks='';
  for (let i=0;i<=4;i++){ const v=max*i/4, y=pad.t+ih-(v/max)*ih;
    grid += `<line x1="${pad.l}" x2="${w-pad.r}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#EEECF6"/>`;
    ticks += `<text class="axis" x="${pad.l-8}" y="${(y+4).toFixed(1)}" text-anchor="end">${fmt(v)}</text>`; }
  const bars = items.map((d,i)=>{
    const x = pad.l + i*step + (step-bw)/2, bh = Math.max(1,(d.value/max)*ih), y = pad.t+ih-bh;
    const col = colors ? colors[i%colors.length] : color;
    const lab = rotate
      ? `<text class="axis" transform="translate(${(x+bw/2).toFixed(1)},${h-46}) rotate(35)" text-anchor="start">${esc(d.label)}</text>`
      : `<text class="axis" x="${(x+bw/2).toFixed(1)}" y="${h-7}" text-anchor="middle">${esc(d.label)}</text>`;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="5" fill="${col}"><title>${esc(d.label)} — ${esc(d.t||fmt(d.value))}</title></rect>${lab}`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px">${grid}${ticks}${bars}</svg>`;
}

function barsH(items, {color=C.violet, fmt=v=>nf2(v), labelW=250, rowH=26, colorFn=null, w=720}={}){
  const h = items.length*rowH + 26, pad={l:labelW, r:64, t:6};
  const iw = w-pad.l-pad.r;
  const max = Math.max(...items.map(d=>d.value)) || 1;
  const rows = items.map((d,i)=>{
    const y = pad.t + i*rowH, bw = Math.max(2,(d.value/max)*iw);
    const col = colorFn ? colorFn(d,i) : color;
    return `<text class="axis" x="${pad.l-10}" y="${y+rowH/2+4}" text-anchor="end">${esc(d.label)}</text>
      <rect x="${pad.l}" y="${y+4}" width="${bw.toFixed(1)}" height="${rowH-12}" rx="4" fill="${col}"><title>${esc(d.label)} — ${esc(fmt(d.value))}</title></rect>
      <text class="axis" x="${(pad.l+bw+8).toFixed(1)}" y="${y+rowH/2+4}">${esc(fmt(d.value))}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px">${rows}</svg>`;
}

function donut(items, {fmt=eur, size=230, highlight=null}={}){
  const total = items.reduce((s,d)=>s+d.value,0);
  const hasHighlight = highlight && highlight !== 'all';
  const r=90, ri=58, cx=size/2, cy=size/2;
  let a0 = -Math.PI/2, paths='';
  items.forEach((d,i)=>{
    const a1 = a0 + (d.value/total)*Math.PI*2;
    const large = (a1-a0) > Math.PI ? 1 : 0;
    const isSel = hasHighlight && d.label === highlight;
    const rr = isSel ? r+6 : r;
    const p = (rad,a)=>[cx+rad*Math.cos(a), cy+rad*Math.sin(a)];
    const [x0,y0]=p(rr,a0), [x1,y1]=p(rr,a1), [x2,y2]=p(ri,a1), [x3,y3]=p(ri,a0);
    const opacity = hasHighlight && !isSel ? 0.3 : 1;
    paths += `<path d="M${x0.toFixed(1)},${y0.toFixed(1)} A${rr},${rr} 0 ${large} 1 ${x1.toFixed(1)},${y1.toFixed(1)} L${x2.toFixed(1)},${y2.toFixed(1)} A${ri},${ri} 0 ${large} 0 ${x3.toFixed(1)},${y3.toFixed(1)} Z" fill="${SERIES[i%SERIES.length]}" opacity="${opacity}"><title>${esc(d.label)} — ${esc(fmt(d.value))} (${pct(d.value/total*100)})</title></path>`;
    a0 = a1;
  });
  const legend = items.map((d,i)=>`<div style="${hasHighlight && d.label!==highlight?'opacity:.5':''}"><i style="background:${SERIES[i%SERIES.length]}"></i>${esc(d.label)} · ${pct(d.value/total*100,1)}</div>`).join('');
  return `<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
    <svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px;flex:0 0 auto">${paths}</svg>
    <div class="legend" style="flex-direction:column;gap:6px">${legend}</div></div>`;
}

function scatter(points, labels, {h=330, k=3}={}){
  const w=720, pad={l:40,r:12,t:12,b:34};
  const xs=points.map(p=>p.x), ys=points.map(p=>p.y);
  const xmin=Math.min(...xs), xmax=Math.max(...xs), ymin=Math.min(...ys), ymax=Math.max(...ys);
  const X=v=>pad.l+(v-xmin)/(xmax-xmin)*(w-pad.l-pad.r);
  const Y=v=>pad.t+(1-(v-ymin)/(ymax-ymin))*(h-pad.t-pad.b);
  const dots = points.map((p,i)=>`<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3" fill="${SERIES[labels[i]%SERIES.length]}" fill-opacity=".72"/>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px">
    <line x1="${pad.l}" x2="${w-pad.r}" y1="${h-pad.b}" y2="${h-pad.b}" stroke="#E6E3F1"/>
    <line x1="${pad.l}" x2="${pad.l}" y1="${pad.t}" y2="${h-pad.b}" stroke="#E6E3F1"/>
    ${dots}
    <text class="axis" x="${w/2}" y="${h-8}" text-anchor="middle">Composante principale 1</text>
    <text class="axis" transform="translate(13,${h/2}) rotate(-90)" text-anchor="middle">Composante principale 2</text></svg>`;
}

function rocChart(models, {h=300}={}){
  const w=460, pad={l:48,r:14,t:12,b:40}, iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const X=v=>pad.l+v*iw, Y=v=>pad.t+(1-v)*ih;
  let grid='';
  for (let i=0;i<=5;i++){
    const t=i/5;
    grid += `<line x1="${pad.l}" x2="${w-pad.r}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" stroke="#EEECF6"/>
      <text class="axis" x="${pad.l-8}" y="${(Y(t)+4).toFixed(1)}" text-anchor="end">${nf1(t).replace(',0','')}</text>
      <text class="axis" x="${X(t).toFixed(1)}" y="${h-22}" text-anchor="middle">${nf1(t).replace(',0','')}</text>`;
  }
  const lines = models.map((m,i)=>{
    const d = m.roc.map((p,j)=>`${j?'L':'M'}${X(p.fpr).toFixed(1)},${Y(p.tpr).toFixed(1)}`).join(' ');
    return `<path d="${d}" fill="none" stroke="${SERIES[i]}" stroke-width="2.2"/>`;
  }).join('');
  const leg = models.map((m,i)=>`<div><i style="background:${SERIES[i]}"></i>${esc(m.nom)} — AUC ${nf2(m.auc).replace('.',',')}</div>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px">${grid}
    <line x1="${X(0)}" y1="${Y(0)}" x2="${X(1)}" y2="${Y(1)}" stroke="#C9C4DE" stroke-dasharray="5 4"/>
    ${lines}
    <text class="axis" x="${w/2}" y="${h-4}" text-anchor="middle">Taux de faux positifs</text>
    <text class="axis" transform="translate(12,${(pad.t+ih/2).toFixed(1)}) rotate(-90)" text-anchor="middle">Taux de vrais positifs</text>
  </svg><div class="legend">${leg}<div><i style="background:#C9C4DE"></i>Modèle aléatoire (AUC 0,50)</div></div>`;
}

function gauge(p, color){
  const size=196, cx=size/2, cy=size/2+8, r=74;
  const a = -Math.PI + p*Math.PI;
  const pt = (rad,ang)=>[cx+rad*Math.cos(ang), cy+rad*Math.sin(ang)];
  const arc = (from,to,col,wd)=>{
    const [x0,y0]=pt(r,from), [x1,y1]=pt(r,to);
    const large = (to-from)>Math.PI?1:0;
    return `<path d="M${x0.toFixed(1)},${y0.toFixed(1)} A${r},${r} 0 ${large} 1 ${x1.toFixed(1)},${y1.toFixed(1)}" fill="none" stroke="${col}" stroke-width="${wd}" stroke-linecap="round"/>`;
  };
  return `<svg viewBox="0 0 ${size} ${size-30}" style="width:${size}px;height:${size-30}px">
    ${arc(-Math.PI, 0, '#EBE8F5', 15)}
    ${p>0.005?arc(-Math.PI, a, color, 15):''}
    <text class="axis" x="${cx-r}" y="${cy+22}" text-anchor="middle">0 %</text>
    <text class="axis" x="${cx+r}" y="${cy+22}" text-anchor="middle">100 %</text>
  </svg>`;
}

function histogram(bins, {h=200, color=C.violet, w=720}={}){
  const items = bins.map(b=>({label:b.bin, value:b.n}));
  const pad={l:46,r:8,t:10,b:28}, iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const max = niceMax(Math.max(...items.map(d=>d.value)));
  const step = iw/items.length;
  let grid='';
  for (let i=0;i<=3;i++){ const v=max*i/3, y=pad.t+ih-(v/max)*ih;
    grid += `<line x1="${pad.l}" x2="${w-pad.r}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#EEECF6"/>
             <text class="axis" x="${pad.l-8}" y="${(y+4).toFixed(1)}" text-anchor="end">${shortNum(v)}</text>`; }
  const bars = items.map((d,i)=>{
    const x=pad.l+i*step+1.5, bw=step-3, bh=Math.max(1,(d.value/max)*ih), y=pad.t+ih-bh;
    const p = parseFloat(d.label);
    const col = p>=0.7?C.rose:(p>=0.4?C.amber:C.teal);
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="${col}"><title>Probabilité ${nf2(p*100)} à ${nf2((p+0.05)*100)} % — ${nf(d.value)} clients</title></rect>`;
  }).join('');
  let xl='';
  [0,0.25,0.5,0.75,1].forEach(t=>{ xl += `<text class="axis" x="${(pad.l+t*iw).toFixed(1)}" y="${h-6}" text-anchor="middle">${nf(t*100)} %</text>`; });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px">${grid}${bars}${xl}</svg>`;
}

function confusion(cm, nom){
  const [[vn,fp],[fn,vp]] = cm;
  const max = Math.max(vn,fp,fn,vp);
  const cell = (v,lab,good)=>{
    const o = 0.12 + 0.78*(v/max);
    const col = good ? `rgba(18,140,126,${o})` : `rgba(200,50,79,${o})`;
    const txt = o>0.55 ? '#fff' : 'var(--text)';
    return `<div class="cell" style="background:${col};color:${txt}"><b>${nf(v)}</b>${lab}</div>`;
  };
  return `<div class="cm">
    <div></div><div class="collab">Prédit : reste client</div><div class="collab">Prédit : churn</div>
    <div class="rowlab">Réel :<br>reste client</div>${cell(vn,'Vrais négatifs',true)}${cell(fp,'Faux positifs',false)}
    <div class="rowlab">Réel :<br>churn</div>${cell(fn,'Faux négatifs',false)}${cell(vp,'Vrais positifs',true)}
  </div>`;
}

/* ---------------- scorer embarqué (arbres exportés du notebook) ---------------- */
function buildVector(raw, M){
  const v = M.num_features.map(f => (raw[f] - M.mean[M.num_features.indexOf(f)]) / M.scale[M.num_features.indexOf(f)]);
  const out = v.slice();
  M.cat_features.forEach(c => {
    M.cat_categories[c].forEach(cat => out.push(raw[c] === cat ? 1 : 0));
  });
  return out;
}
function scoreTrees(x0, M){
  // Les arbres comparent en simple précision : Math.fround reproduit exactement
  // le comportement de scikit-learn / XGBoost sur les valeurs proches d'un seuil.
  const x = x0.map(Math.fround);
  const strict = M.type === 'xgb';
  const descend = t => { let n = 0;
    while (t.l[n] !== -1) n = (strict ? x[t.f[n]] < t.t[n] : x[t.f[n]] <= t.t[n]) ? t.l[n] : t.r[n];
    return n; };
  if (M.type === 'forest'){
    let s = 0;
    for (const t of M.trees) s += t.v[descend(t)];
    return s / M.trees.length;
  }
  let s = M.init, lr = M.lr === undefined ? 1 : M.lr;
  for (const t of M.trees) s += lr * t.v[descend(t)];
  return 1 / (1 + Math.exp(-s));
}

function miniStat(label, val, sub){
  return `<div style="border:1px solid var(--line);border-radius:12px;padding:12px 14px">
    <div style="font-size:12.5px;color:var(--muted)">${esc(label)}</div>
    <div style="font-family:var(--display);font-weight:700;font-size:17px;margin-top:3px">${esc(val)}</div>
    <div style="font-size:12px;color:var(--faint)">${esc(sub)}</div></div>`;
}
function numField(f, val, step){
  const lab = D.churn.modele_embarque.labels[f] || f;
  /* type="text" + inputmode="decimal" au lieu de type="number" : avec un champ
     numérique HTML, une valeur saisie avec une VIRGULE (« 143,35 », ce que
     produit le pavé numérique d'un clavier français) est considérée comme
     invalide par le navigateur, et input.value renvoie une chaîne VIDE.
     Le champ paraissait rempli mais valait 0 côté calcul. */
  return `<div class="field"><label for="in_${f}">${esc(lab)}</label>
    <input type="text" inputmode="decimal" autocomplete="off" id="in_${f}"
           data-f="${f}" data-step="${step}" value="${round(val, step<1?2:0)}"></div>`;
}
function selField(f, options, val, tr){
  const lab = D.churn.modele_embarque.labels[f] || f;
  return `<div class="field"><label for="in_${f}">${esc(lab)}</label>
    <select id="in_${f}" data-f="${f}">${options.map(o=>`<option value="${o}"${o===val?' selected':''}>${esc(tr[o]||o)}</option>`).join('')}</select></div>`;
}
const round = (v,d) => Number(v).toFixed(d);

/* Accepte « 143,35 » comme « 143.35 », ainsi que les espaces de milliers. */
function parseNum(txt){
  const t = String(txt).trim().replace(/[\s\u00A0']/g, '').replace(',', '.');
  if (t === '') return NaN;
  const v = Number(t);
  return Number.isFinite(v) ? v : NaN;
}
function readSim(){
  const raw = {};
  const invalides = [];
  document.querySelectorAll('#simForm [data-f]').forEach(inp=>{
    const f = inp.dataset.f;
    if (inp.tagName === 'SELECT'){ raw[f] = inp.value; return; }
    const v = parseNum(inp.value);
    if (Number.isNaN(v)){
      inp.classList.add('invalid');
      invalides.push(D.churn.modele_embarque.labels[f] || f);
      raw[f] = 0;
    } else {
      inp.classList.remove('invalid');
      raw[f] = v;
    }
  });
  raw.montant_total = raw.panier_moyen * raw.frequence;
  raw.frequence_mensuelle = raw.frequence / ((raw.anciennete + 1) / 30);
  raw.ratio_activite_recente = raw.frequence ? raw.freq_recente / raw.frequence : 0;
  raw.ratio_montant_recent = raw.montant_recent / (raw.montant_total + 1e-5);
  raw.retard_inter_achat = raw.recence / (raw.delai_moyen_inter_achat + 1e-5);
  raw.ratio_diversite_produit = raw.frequence ? raw.produits_uniques / raw.frequence : 0;
  /* Toute valeur non finie (division par zéro, champ aberrant) est ramenée à 0
     pour ne jamais propager un NaN jusqu'aux arbres. */
  D.churn.modele_embarque.num_features.forEach(f=>{
    if (!Number.isFinite(raw[f])) raw[f] = 0;
  });
  raw.__invalides = invalides;
  return raw;
}
/* Les variables dérivées se recalculent en direct à chaque frappe,
   mais la prédiction elle-même n'est lancée que par le bouton « Prédire ». */
let predictionAffichee = false;

function updateDerived(raw){
  raw = raw || readSim();
  const d = document.getElementById('derived');
  if (!d) return raw;
  d.innerHTML = [
    ['Montant total dépensé', eur2(raw.montant_total)],
    ["Fréquence mensuelle d'achat", nf2(raw.frequence_mensuelle)],
    ['Retard d\'achat', nf2(raw.retard_inter_achat)],
    ['Part des achats sur 90 jours', pct(raw.ratio_activite_recente*100)],
    ['Part du montant sur 90 jours', pct(raw.ratio_montant_recent*100)],
    ['Diversité produit', nf2(raw.ratio_diversite_produit)],
  ].map(([k,v])=>`<li>${esc(k)} : <b>${v}</b></li>`).join('');
  return raw;
}

/* Appelée à chaque modification d'un champ : met à jour les dérivées et,
   si une prédiction est déjà affichée, la rafraîchit en direct. */
function onSimInput(){
  const raw = updateDerived();
  if (predictionAffichee) runSim(raw);
}

/* Point d'entrée du bouton « Prédire ». Il ne reste JAMAIS muet :
   soit il affiche une prédiction, soit il explique ce qui l'en empêche. */
function runSim(rawPrecalcule){
  const body = document.getElementById('predictBody');
  const ph = document.getElementById('predictPlaceholder');
  const reveal = () => { if (ph) ph.style.display='none'; if (body) body.classList.add('shown'); };
  try{
    const raw = rawPrecalcule || readSim();
    if (raw.__invalides && raw.__invalides.length){
      reveal();
      predictionAffichee = false;
      document.getElementById('gaugeHolder').innerHTML = '';
      document.getElementById('contrib').innerHTML = '';
      document.getElementById('verdict').innerHTML =
        `<div class="verdict" style="background:var(--rose-soft);color:var(--rose)">
           <b>Valeurs illisibles</b>
           <span style="color:var(--text)">Corrigez ces champs puis relancez :
           ${esc(raw.__invalides.join(', '))}. Utilisez un point ou une virgule
           comme séparateur décimal, sans autre caractère.</span></div>`;
      return;
    }
    predictCore(raw);
  }catch(err){
    reveal();
    predictionAffichee = false;
    const v = document.getElementById('verdict');
    if (v) v.innerHTML =
      `<div class="verdict" style="background:var(--rose-soft);color:var(--rose)">
         <b>La prédiction a échoué</b>
         <span style="color:var(--text)">${esc(err && err.message ? err.message : err)}</span></div>`;
    console.error('[MarketIA] échec de la prédiction :', err);
  }
}

function predictCore(rawPrecalcule){
  const M = D.churn.modele_embarque, raw = rawPrecalcule || readSim();
  updateDerived(raw);
  const proba = scoreTrees(buildVector(raw, M), M);
  const seuil = M.seuil;
  const niveau = proba >= 0.7 ? {t:'Risque élevé', c:C.rose, bg:'var(--rose-soft)',
      a:"Contact direct et offre de réactivation : ce client se situe au-dessus du seuil de décision du modèle."}
    : proba >= 0.4 ? {t:'Risque moyen', c:C.amber, bg:'var(--amber-soft)',
      a:"Relance ciblée par e-mail avec une recommandation produit issue de ses catégories d'achat."}
    : {t:'Risque faible', c:C.teal, bg:'var(--teal-soft)',
      a:"Client actif : privilégier la fidélisation et les ventes croisées plutôt qu'une remise."};
  document.getElementById('gaugeHolder').innerHTML =
    gauge(proba, niveau.c) +
    `<div class="gauge-val" style="color:${niveau.c}">${nf1(proba*100)} %</div>
     <div class="gauge-cap">probabilité de départ · seuil du modèle : ${nf2(seuil).replace('.',',')}</div>`;
  document.getElementById('verdict').innerHTML =
    `<div class="verdict" style="background:${niveau.bg};color:${niveau.c}"><b>${niveau.t}</b>
      <span style="color:var(--text)">${esc(niveau.a)}</span></div>`;

  const stats = D.churn.stats_features, M2 = D.churn.modele_embarque;
  const top = D.churn.modeles.find(m=>m.nom===D.churn.modele_deploye).importances
    .filter(i => M2.num_features.includes(i.feature)).slice(0,5);
  document.getElementById('contrib').innerHTML = top.map(i=>{
    const v = raw[i.feature], med = stats[i.feature].median;
    const up = v >= med;
    return `<div class="contrib-row"><span style="color:var(--muted)">${esc(i.label)}</span>
      <b style="color:${up?C.rose:C.teal}">${fmtVal(i.feature,v)} <span style="color:var(--faint);font-weight:400">(médiane ${fmtVal(i.feature,med)})</span></b></div>`;
  }).join('');

  /* On révèle le panneau de droite et on masque l'état d'attente. */
  const ph = document.getElementById('predictPlaceholder');
  const body = document.getElementById('predictBody');
  if (ph) ph.style.display = 'none';
  if (body) body.classList.add('shown');
  predictionAffichee = true;

  /* Sur petit écran la carte passe sous le formulaire : on l'amène à l'écran. */
  if (window.matchMedia('(max-width:860px)').matches){
    const card = document.getElementById('resultCard');
    if (card) card.scrollIntoView({behavior:'smooth', block:'nearest'});
  }
}
function fmtVal(f, v){
  if (f.startsWith('montant') || f.startsWith('panier')) return eur2(v);
  if (f.startsWith('ratio')) return nf2(v);
  if (f === 'recence' || f === 'anciennete' || f === 'delai_moyen_inter_achat') return nf(v) + ' j';
  return nf2(v).replace(',00','');
}

/* ---------- 7. Stratégie ---------- */
function pageStrategy(){
  const s = D.strategie, sc = D.churn.scoring;

    const delta = r.budget_propose - r.budget_actuel;

      <td class="num">${nf1(r.roas)} ×</td><td class="num">${eur(r.budget_propose)}</td>
      <td class="num" style="color:${delta>=0?C.teal:C.rose};font-weight:600">${delta>=0?'+':'−'}${eur(Math.abs(delta))}</td></tr>`;
  }).join('');
  const actions = s.actions.map((a,i)=>`
    <div class="seg-card">
      <div class="seg-head"><span class="seg-swatch" style="background:${[C.rose,C.amber,C.teal][i]}"></span>

      <div class="stat-row"><span>Clients concernés</span><b>${nf(a.n_clients)}</b></div>

      <div style="margin-top:11px;font-size:13px">${esc(a.action)}</div>
    </div>`).join('');
  const prioritaires = s.segments_prioritaires.slice().sort((a,b)=>b.part_ca-a.part_ca);
  const prioCards = prioritaires.map((x,i)=>`
    <div class="priority-card">

  <div class="kpis">
    ${kpi('Budget des campagnes', eur(s.budget_total), 'montant réparti, inchangé', true)}
    ${kpi('Budget de rétention suggéré', eur(s.budget_retention), '5 % du CA des clients au-dessus du seuil')}
    ${kpi('Clients à réactiver', nf(sc.n_a_risque), `probabilité ≥ ${nf2(sc.seuil).replace('.',',')}`)}
    ${kpi('CA historique concerné', eur(sc.ca_en_jeu), 'dépenses déjà réalisées par ces clients')}
  </div>
  <section class="card span2 priority-section" style="margin-bottom:16px">
    <h3>🛡️ Segments à protéger en priorité</h3>
    <div class="hint">Segments issus de l'étape 4 (profilage), classés par contribution au chiffre d'affaires — à préserver en priorité dans le plan de rétention.</div>
    <div class="priority-list">${prioCards}</div>
  </section>
  <div class="grid g2">
    ${card('Réallocation du budget par canal', s.regle_reallocation,
      `<div class="table-wrap"><table><thead><tr><th>Canal</th><th class="num">Budget actuel</th><th class="num">Retour observé</th><th class="num">Budget proposé</th><th class="num">Écart</th></tr></thead><tbody>${rows}</tbody></table></div>`, 'span2')}
    ${card('Budget actuel', 'Répartition d\'origine', donut(s.reallocation.map(r=>({label:r.canal, value:r.budget_actuel}))))}
    ${card('Budget proposé', 'Après réallocation au prorata du retour observé', donut(s.reallocation.map(r=>({label:r.canal, value:r.budget_propose}))))}
    <section class="card span2">
      <h3>Plan de rétention par niveau de risque</h3>

      <div class="grid g3">${actions}</div>

}

/* ---------------- rendu ---------------- */
const RENDER = {overview:pageOverview, data:pageData, segments:pageSegments, profiling:pageProfiling,
                campaigns:pageCampaigns, churn:pageChurn, strategy:pageStrategy, about:pageAbout};

function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = '<div class="nav-label">Navigation</div>' + PAGES.map(p=>
    `<button data-page="${p.id}"${p.id===current?' aria-current="page"':''}><span class="dot"></span>${esc(p.nom)}</button>`).join('');
  nav.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
    current = b.dataset.page;
    render();
    window.scrollTo({top:0});   // c'est la page (le document) qui défile
  }));
}
function render(){
  renderNav();
  const p = PAGES.find(x=>x.id===current);
  document.getElementById('main').innerHTML = `
    <div class="topline">
      <div>
        <span class="chip">${esc(p.etape)}</span>
        <h1 class="page">${esc(p.nom)}</h1>
        <div class="page-lede">${esc(p.lede)}</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <span class="chip neutral">${frDate(D.meta.periode_debut)} → ${frDate(D.meta.periode_fin)}</span>
      </div>
    </div>` + RENDER[current]();
  if (current === 'churn'){
    predictionAffichee = false;
    document.querySelectorAll('#simForm [data-f]').forEach(i=>{
      i.addEventListener('input', onSimInput);
      i.addEventListener('change', onSimInput);
    });
    const predictBtn = document.getElementById('predictBtn');
    if (predictBtn) predictBtn.addEventListener('click', ()=>runSim());
    document.querySelectorAll('.presets button').forEach(b=>b.addEventListener('click',()=>{
      const ex = D.churn.clients_exemples[+b.dataset.ex];
      document.querySelectorAll('#simForm [data-f]').forEach(inp=>{
        const f = inp.dataset.f;
        if (ex[f] !== undefined) inp.value = inp.type==='number' ? round(ex[f], inp.step==='1'?0:2) : ex[f];
      });
      runSim();   // un exemple cliqué affiche directement sa prédiction
    }));
    updateDerived();  // dérivées visibles dès l'ouverture, sans prédiction
  }
  if (current === 'segments'){
    document.querySelectorAll('.switch button').forEach(b=>b.addEventListener('click',()=>{ segK = +b.dataset.k; render(); }));
  }
  if (current === 'overview'){
    document.querySelectorAll('#ovYearSwitch button').forEach(b=>b.addEventListener('click',()=>{ ovYear = b.dataset.yr; render(); }));
    document.querySelectorAll('#ovCatSwitch button').forEach(b=>b.addEventListener('click',()=>{ ovCat = b.dataset.cat; render(); }));
  }
  /* Les graphiques viennent d'être reconstruits : on réactive les infobulles. */
  if (typeof enhanceCharts === 'function') enhanceCharts(document.getElementById('main'));
  reportHeight();
}

/* Quand ce document est affiché dans une iframe Streamlit (app.py ou
   dashboard_page.py), il transmet sa hauteur réelle à la page hôte par
   postMessage : la page hôte peut alors redimensionner l'iframe pour
   qu'elle corresponde exactement au contenu, au lieu d'une hauteur fixe
   devinée à l'avance (source du bug de défilement bloqué). Sans effet
   si le document n'est pas dans une iframe, ou si la page hôte n'écoute
   pas ce message (postMessage échoue silencieusement dans ce cas). */
function reportHeight(){
  try{
    if (window.parent === window) return;
    const h = Math.ceil(document.documentElement.scrollHeight);
    window.parent.postMessage({type:'marketia-resize', height:h}, '*');
  }catch(e){}
}
window.addEventListener('resize', reportHeight);
if (window.ResizeObserver){
  new ResizeObserver(reportHeight).observe(document.body);
}

/* Le bouton d'import a été retiré de la barre latérale : l'ancien gestionnaire
   appelait addEventListener sur un élément inexistant, ce qui interrompait
   tout le script (page blanche). Il est donc supprimé.
   Le premier rendu est déclenché à la toute fin du script, une fois le moteur
   d'infobulles défini. */

/* ---------------- infobulles des graphiques ----------------
   Dans un SVG, <title> est un ÉLÉMENT ENFANT, pas un attribut : l'ancien
   sélecteur 'svg [title]' ne correspondait donc à rien et aucune infobulle
   personnalisée ne s'affichait. On convertit chaque <title> en attribut
   data-tip (ce qui supprime au passage l'infobulle native, lente et grise),
   puis on gère le survol nous-mêmes.                                        */
const tip = document.createElement('div');
tip.className = 'chart-tooltip';
document.body.appendChild(tip);

let hovered = null;
function hideTip(){
  tip.classList.remove('visible');
  if (hovered){ hovered.classList.remove('is-hover'); hovered = null; }
}
function placeTip(e){
  const x = Math.min(e.clientX + 14, window.innerWidth  - tip.offsetWidth  - 12);
  const y = Math.min(e.clientY + 14, window.innerHeight - tip.offsetHeight - 12);
  tip.style.left = Math.max(8, x) + 'px';
  tip.style.top  = Math.max(8, y) + 'px';
}

/* À rappeler après chaque rendu, puisque le HTML des cartes est reconstruit. */
function enhanceCharts(root){
  (root || document).querySelectorAll('svg title').forEach(t=>{
    const shape = t.parentNode;
    if (shape && shape.tagName !== 'svg'){
      shape.setAttribute('data-tip', t.textContent);
      t.remove();                       // plus d'infobulle native en doublon
    }
  });
}

document.addEventListener('pointerover', e=>{
  const target = e.target.closest && e.target.closest('[data-tip]');
  if (!target || target === hovered) return;
  if (hovered) hovered.classList.remove('is-hover');
  hovered = target;
  target.classList.add('is-hover');
  const txt = String(target.getAttribute('data-tip'))
    .replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const sep = txt.indexOf(' — ');
  tip.innerHTML = sep === -1
    ? txt
    : `${txt.slice(0, sep)}<br><b>${txt.slice(sep + 3)}</b>`;
  tip.classList.add('visible');
  placeTip(e);
});
document.addEventListener('pointermove', e=>{
  if (tip.classList.contains('visible')) placeTip(e);
});
document.addEventListener('pointerout', e=>{
  const target = e.target.closest && e.target.closest('[data-tip]');
  if (target && !target.contains(e.relatedTarget)) hideTip();
});
document.addEventListener('scroll', hideTip, {passive:true, capture:true});

render();

</script>
